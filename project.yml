name: SoloCheckIn
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.solocheckin
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
targets:
  SoloCheckIn:
    type: application
    platform: iOS
    sources: [SoloCheckIn, Shared]
    dependencies:
      - target: SoloCheckInWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APS_ENVIRONMENT: development
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SoloCheckIn AppStore
          APS_ENVIRONMENT: production
    entitlements:
      path: SoloCheckIn/SoloCheckIn.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hgsldswk.solocheckin]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.hgsldswk.solocheckin]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: SoloCheckIn/Info.plist
      properties:
        CFBundleDisplayName: Solo Check-In
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APP_STORE_ID: $(APP_STORE_ID)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
        NSAlarmKitUsageDescription: Schedule the check-in alarms you choose.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID)
            CFBundleURLSchemes: [solocheckin]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Solo Check-In Settings
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.solocheckin.settings]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.solocheckin.settings
            UTTypeDescription: Solo Check-In Settings
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [solocheckin]
        LSSupportsOpeningDocumentsInPlace: true
  SoloCheckInWidget:
    type: app-extension
    platform: iOS
    sources:
      - SoloCheckInWidget
      - path: Shared
        excludes: [Cloud.swift, QR.swift, ShareCode.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SoloCheckIn Widget AppStore
    entitlements:
      path: SoloCheckInWidget/SoloCheckInWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.solocheckin]
    info:
      path: SoloCheckInWidget/Info.plist
      properties:
        CFBundleDisplayName: Solo Check-In
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SoloCheckInTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SoloCheckInTests
      - path: Shared
        excludes: [Cloud.swift, CheckInIntent.swift, LocalStore.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  SoloCheckInUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SoloCheckInUITests]
    dependencies:
      - target: SoloCheckIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SoloCheckIn
schemes:
  SoloCheckIn:
    build:
      targets:
        SoloCheckIn: all
        SoloCheckInTests: [test]
    test:
      config: Debug
      targets: [SoloCheckInTests]
  SoloCheckInUI:
    build:
      targets:
        SoloCheckIn: all
        SoloCheckInUITests: [test]
    test:
      config: Debug
      targets: [SoloCheckInUITests]
